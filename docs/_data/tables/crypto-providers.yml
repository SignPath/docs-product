hashSigningData-format:
  headers:
    property: JSON property
    value: Value
    remarks: Remarks
  body:
    - property: "`signatureAlgorithm`"
      value: |
        `Rsa`, `Ecdesa`, or `Mldsa`
    - property: "`rsaOptions.hashAlgorithmName`"
      value: |
        **TODO**
        * Sha1
        * ...
    - property: "`rsaOptions.hashAlgorithmOid`"
      value: |
        **TODO: obsolete, redundant, or for extensibility?**

        The OID for the hash algorithm used. Available values: 
        * MD5: `1.2.840.113549.2.5`
        * SHA1: `1.3.14.3.2.26`
        * SHA-256: `2.16.840.1.101.3.4.2.1`
        * SHA-384: `2.16.840.1.101.3.4.2.2`
        * SHA-512: `2.16.840.1.101.3.4.2.3`
    - property: "`rsaOptions.paddingMode`"
      value: |
        * `Pkcs1`: PKCS #1 v1.5 padding mode
        * `Pss`: PSS padding mode (PKCS #1 v2.1)
      remarks: Only used for RSA keys.
    - property: "`ecdsaOptions.signatureFormat`"
      value: |
        * `Ieee` (default): IEEE P1363 fixed-size signature block
        * `Asn1`: RFC 3279 ASN.1 sequence
      remarks: Only used for ECDSA keys.
    - property: "`mldsaOptions.preHashAlgorithmOid`"
      value: |
         **TODO**
    - property: "`hash`"
      value: |
        The Base64 encoded hash value to sign.
      remarks: |
        For RSA, the result of the function specified as `rsaOptions.hashAlgorithmName` or `rsaOptions.hashAlgorithmOid, respectively`.
        **TODO self-evident? how about the others?**
    - property: "`metadata`"
      value: |
        `sourceProcess` object with `commandLine`, `user`, and `operatingSystem {type, version, architecture}` properties (see example below).
      remarks: | 
        Can contain arbitrary metadata JSON values. SignPath crypto providers provide specific values for auditing purposes.
