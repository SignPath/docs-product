signing-file-elements:
  headers:
    element: Element
    isComposite: "[Composite format](#containers)"
    directive: Signing directives
    extensions: Extensions
    description: Description
    notes: Notes
    _attributes:
      element: {style: "width: 9em;"}
      directive: {style: "width: 10em;"}
  body:
    - element: "`<pe-file>`"
      isComposite: "No"
      directive: "[`<authenticode-sign>`](#authenticode-sign)"
      extensions: ".exe, .dll, .acm, .ax, .cpl, .drv, .efi, .mui, .ocx, .scr, .sys, .tsp"
      description: "Portable Executable (PE) files: EXE, DLL, and other executable files"
    - element: "`<powershell-file>`"
      isComposite: "No"
      directive: "[`<authenticode-sign>`](#authenticode-sign)"
      extensions: ".ps1, .psm1, psd1, .psdc1, .ps1xml"
      description: "PowerShell scripts and modules"
    - element: "`<windows-script-file>`"
      isComposite: "No"
      directive: "[`<authenticode-sign>`](#authenticode-sign)"
      extensions: ".wsf, ,vbs, .js"
      description: "Scripts for Windows Scripting Host, typically [VBScript](https://en.wikipedia.org/wiki/VBScript) and [JScript](https://en.wikipedia.org/wiki/JScript)"
      notes: |
        Not available for Code Signing Starter. 
        Note that JavaScript engines will not recognize JScript signatures.
    - element: "`<msi-file>`"
      isComposite: "Yes"
      directive: "[`<authenticode-sign>`](#authenticode-sign)"
      extensions: ".msi, .msm, .msp"
      description: "Microsoft installer files"
    - element: "`<cab-file>`"
      isComposite: "Yes"
      directive: "[`<authenticode-sign>`](#authenticode-sign)"
      extensions: ".cab"
      description: "Windows cabinet files"
    - element: "`<catalog-file>`"
      isComposite: "No"
      directive: "[`<authenticode-sign>`](#authenticode-sign)"
      extensions: ".cat"
      description: "Windows catalog files"
    - element: "`<appx-file>`"
      isComposite: "Yes"
      directive: "[`<authenticode-sign>`](#authenticode-sign)"
      extensions: ".appx, .appxbundle"
      description: "App packages for Microsoft Store/Universal Windows Platform"
      notes: "The Common Name of the code signing certificate must match the `PublisherDisplayName` in the `AppxManifest.xml` file."
    - element: "`<msix-file>`"
      isComposite: "Yes"
      directive: "[`<authenticode-sign>`](#authenticode-sign)"
      extensions: ".msix, .msixbundle"
      description: "MSIX installer app packages for Microsoft Windows"
    - element: "`<opc-file>`"
      isComposite: "Yes"
      directive: "[`<opc-sign>`](#opc-sign)"
      extensions: ".vsix, .xps, hlkx, ..."
      description: "Open Packaging Conventions (OPC) files including Visual Studio Extensions (VSIX) and Hardware Lab Kit driver signing packages"
      notes: |
        Driver signing not available for Code Signing Starter. 
        File size limit: 40 MB.
    - element: "`<nupkg-file>`"
      isComposite: "Yes"
      directive: "[`<nuget-sign>`](#nuget-sign)"
      extensions: ".nupkg"
      description: "NuGet packages"
    - element: "`<jar-file>`"
      isComposite: "Yes"
      directive: "[`<jar-sign>`](#jar-sign)"
      extensions: ".jar, .war, .ear, .aab"
      description: "Java packages/archives"
    - element: "`<apk-file>`"
      isComposite: "Yes"
      directive: "[`<apk-sign>`](#apk-sign)"
      extensions: ".apk"
      description: "Android app packages"
    - element: "`<rpm-file>`"
      isComposite: "Yes"
      directive: "[`<rpm-sign>`](#rpm-sign)"
      extensions: ".rpm"
      description: "RPM Package Manager files"
    - element: "`<deb-file>`"
      isComposite: "Yes"
      directive: "[`<debsigs-sign>`](#debsigs-sign)"
      extensions: ".deb"
      description: "Debian package files"
    - element: "[`<zip-file>`](syntax#zip-file-element)"
      isComposite: "Yes"
      directive: "[`<jar-sign>`](#jar-sign)"
      extensions: ".zip"
      description: |
        Use ZIP archives to sign multiple files at once or to add additional files: 
        [enveloped](#enveloped-signing-methods) and [detached](#detached-signing-methods) signatures,
        and [attestations](attestations).
        (ZIP archives can also be signed like [JAR files](#jar-sign).)
    - element: "`<office-oxml-file>`"
      isComposite: "No"
      directive: "[`<office-macro-sign>`](#office-macro-sign)"
      extensions: ".xlsm, .xltm, .docm, .dotm, .pptm, .potm, .vsdm, vstm, ... "
      description: "Sign VBA macros in Microsoft Office Open XML files and templates: Excel, Word, PowerPoint and Visio"
    - element: "`<office-binary-file>`"
      isComposite: "No"
      directive: "[`<office-macro-sign>`](#office-macro-sign)"
      extensions: ".xls, .xlt, .doc, .dot, .pot, .ppa, .pps, .ppt, .mpp, .mpt, .pub, .vsd, .vst, ... "
      description: "Sign VBA macros in binary Microsoft Office files and templates: Project, Publisher, and legacy Excel, Word, PowerPoint and Visio"
    - element: "`<xml-file>`"
      isComposite: "No"
      directive: "[`<xml-sign>`](#xml-sign)"
      extensions: ".xml"
      description: "Sign XML files using [XMLDSIG](https://www.w3.org/TR/xmldsig-core1/)"
      notes: "File size limit: 2 MB."
    - element: "`<json-file>`"
      isComposite: "No"
      directive: "[`<jsf-sign>`](#jsf-sign)"
      extensions: ".json"
      description: "Sign JSON files using [JSON Signature Format (JSF)](https://cyberphone.github.io/doc/security/jsf.html?)."
    - element: "`<oci-image-layout-archive-file>`"
      isComposite: "No"
      directive: |
        [`<notation-sign>`](#notation-sign),
        [`<cosign-sign>`](#cosign-sign)
      extensions: '.tar'
      description: "Sign [container images](/signing-containers) uploaded in an OCI layout file."
    - element: "[`<directory>`](syntax#directory-element)"
      isComposite: "Yes"
      directive: "[`<clickonce-sign>`](#clickonce-sign)"
      description: "Specify directories within composite files, e.g. ZIP, MSI, or other directories. Can also be used to sign ClickOnce files and VSTO add-ins."
    - element: "`<file>`"
      isComposite: "No"
      directive: |
        [`<dsse-sign>`](#dsse-sign),
        [`<smime-sign>`](#smime-sign),
        [`<create-cms-signature>`](#create-cms-signature),
        [`<create-gpg-signature>`](#create-gpg-signature),
        [`<create-raw-signature>`](#create-raw-signature)
      extensions: "*"
      description: |
        Create generic signatures for arbitrary files: 
        [DSSE](#dsse-sign), [S/MIME](#smime-sign), [CMS/PKCS #7](#create-cms-signature), [GPG/OpenPGP](#create-gpg-signature), [raw signatures](#create-raw-signature)

signing-method-categories:
  headers:
    category: Category
    description: How it works
    file: Signed file
    notes: Notes
    syntax: General syntax pattern
    _attributes:
      directive: {style: "font-weight: bold;"}
  body:
    - category: "##### Embedded {#embedded-signing-methods}"
      description: Adds a signature to an existing file.
      file: Replaces original file
      notes: |
        A signature is added, and the file's format does not change. The signed file replaces the unsigned file for all practical purposes.

        Several platforms including Windows, Apple, and Java provide a variety of file formats that support embedded signatures. 
      syntax: |
        `<`_format_`-sign />`
    - category: "##### Enveloped {#enveloped-signing-methods}"
      description: Adds a new file that contains the unsigned file _and_ the signature.
      file: Added
      notes: |
        The signed file consists of the signature and the original file, often encoded. The original file usually needs to be extracted from the enveloped file in order to be used. Depending on the format and tool, extraction and verifcation are ideally a single step.

        Enveloped signatures are available for all file types using the `<file>` element. 
      syntax: |
        `<`_format_`-sign output-file-name="..." />`
    - category: "##### Detached {#detached-signing-methods}"
      description: Adds a new file that contains only the signature.
      file: Added
      notes: |
        The signature file contains the signature and a cryptographic hash code of the original file. Verify the signature before accessing the signed file.
        
        Detached signatures are available for all file types using the `<file>` element.         
      syntax: |
        `<create-`_format_`-signature output-file-name="..." />`
      
