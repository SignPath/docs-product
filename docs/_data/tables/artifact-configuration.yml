authenticode-attributes:
  headers:
    attribute: Attribute
    default: Default
    values: Values
    description: Description
  body:
    - attribute: "`hash-algorithm`"
      default: "`sha-256`"
      values: "`sha1`, `sha256`, `sha384`, `sha512`"
      description: |
        Hash algorithm used to calculate the signature digest.

        {:.p.info}
        `<appx-file>` and `<msix-file>` don't support `sha1` and require the `hash-algorithm` to match the one specified in the `AppxBlockMap.xml` file.
    - attribute: "`description`"
      default: ""
      values: "text"
      description: "Description of the signed content"
    - attribute: "`description-url`"
      default: ""
      text: "URL"
      description: "Uniform Resource Locator (URL) for the expanded description of the signed content"
    - attribute: "`append`"
      default: "`false`"
      values: boolean
      description: "When true, append the signature to any existing signatures. When false, replace any existing signatures. See below for supported formats."

directory-example:
  headers:
    fragment: The following fragment
    equivalent: is equivalent to
  body:
    - fragment: |
        ~~~ xml
        <zip-file> 

          <pe-file path="myapp/module/bin/program.exe">
            <authenticode-sign/>
          </pe-file>
          <pe-file path="myapp/module/bin/library.dll">
            <authenticode-sign/>
          </pe-file>

        </zip-file>
        ~~~
      equivalent: |
        ~~~ xml
        <zip-file>
          <directory path="myapp/module/bin">
            <pe-file path="program.exe">
              <authenticode-sign/>
            </pe-file>
            <pe-file path="library.dll">
              <authenticode-sign/>
            </pe-file>
          </directory>
        </zip-file>
        ~~~

file-set-example:
  headers:
    fragment: The following fragment
    equivalent: is equivalent to
  body:
    - fragment: |
        ~~~ xml
        <pe-file path="first.dll">
          <authenticode-sign/>
        </pe-file>

        <pe-file path="second.dll">
          <authenticode-sign/>
        </pe-file>
        ~~~
      equivalent: |
        ~~~ xml
        <pe-file-set>
          <include path="first.dll" />
          <include path="second.dll" />
          <for-each>
            <authenticode-sign/>
          </for-each>
        </pe-file-set>
        ~~~

similar-directories-example:
  headers:
    source:
    image:
  body:
    - source: |
        ~~~ xml
        <artifact-configuration xmlns="http://signpath.io/artifact-configuration/v1">
          <msi-file>

            <pe-file path="MyApp.exe">
              <authenticode-sign/> 
            </pe-file>

            <directory-set>
              <include path="en" />
              <include path="en-US" />
              <include path="de-DE" />
              <for-each>
                <pe-file-set>
                  <include path="MyApp.*.resources.dll"
                           min-matches="0" max-matches="unbounded" />
                  <for-each>
                    <authenticode-sign/>
                  </for-each>
                </pe-file-set>
              </for-each>
            </directory-set>

            <authenticode-sign/>

          </msi-file>
        </artifact-configuration>
        ~~~
      image: "![graphical artifact configuration](/assets/img/resources/artifact-configuration/artifact-configuration_similar-definition.png)"

similar-directories-example-match:
  headers:
    text:
    image:
  body:
    - text: |
        ~~~
        • MyApp.msi 
          • MyApp.exe
            • en/
              • MyApp.Module1.resources.dll
              • MyApp.Module2.resources.dll
            • en-US/
              • MyApp.Module2.resources.dll
            • de-DE/
              • MyApp.Module1.resources.dll
              • MyApp.Module2.resources.dll
        ~~~

        (All `msi`, `exe` and `dll` files are signed with Authenticode.)
      image: "![graphical resolved artifacts](/assets/img/resources/artifact-configuration/artifact-configuration_similar-resolved.png)"
